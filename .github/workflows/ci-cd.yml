name: CI-CD Logistics Management

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - shipment-service
          - notification-service

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x gradlew

      - name: Ejecutar pruebas y validación de cobertura
        run: ./gradlew clean check --no-daemon

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/build/reports/tests/test/**
            ${{ matrix.service }}/build/reports/jacoco/test/**
            ${{ matrix.service }}/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publicar Docker ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - shipment-service
          - notification-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/logistics-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/logistics-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
